name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:

  build:
    name: Builder
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25.x'

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v6
      with:
        version: v1.62.2
        args: --timeout=5m

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...